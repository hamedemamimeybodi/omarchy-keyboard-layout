name: Source regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native-and-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libjson-c-dev
      - name: Build source and test executables
        run: make -C native clean all build/test_hypr_ipc build/test_layout_memory
      - name: Native parser and memory units
        run: |
          native/build/test_hypr_ipc
          native/build/test_layout_memory
      - name: Widget model regressions
        run: node tests/layout-state.test.mjs
      - name: Private transport scenarios
        run: python3 tests/private_ipc_integration.py native/keyboard-layoutd
